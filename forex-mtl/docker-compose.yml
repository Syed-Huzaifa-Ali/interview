version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: forex-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  one-frame:
    image: paidyinc/one-frame
    container_name: forex-one-frame
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/rates?pair=USDJPY", "-H", "token: 10dc303535874aeccc86a8251e6992f5"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
    driver: local