app {
  http {
    host = "0.0.0.0"
    host = ${?HTTP_HOST}

    port = 3000
    port = ${?HTTP_PORT}

    timeout = 40 seconds
  }

  auth {
    # API token for internal services to authenticate with our service
    # In production, override with AUTH_TOKEN environment variable
    token = "REPLACE_WITH_REAL_TOKEN"
    token = ${?AUTH_TOKEN}
  }

  one-frame {
    # One-Frame service base URL
    base-url = "http://localhost:8080"
    base-url = ${?ONE_FRAME_BASE_URL}

    # One-Frame API token for authentication
    # In production, override with ONE_FRAME_TOKEN environment variable
    token = "REPLACE_WITH_ONE_FRAME_TOKEN"
    token = ${?ONE_FRAME_TOKEN}

    # Request timeout for calling One-Frame API
    request-timeout = 400 milliseconds

    # Connection timeout
    connect-timeout = 200 milliseconds
  }

  redis {
    # Redis server URI
    uri = "redis://localhost:6379"
    uri = ${?REDIS_URI}

    # Cache TTL (time to live) - rates older than this are considered stale
    cache-ttl = 5 minutes

    # Background refresh interval
    refresh-interval = 5 minutes
  }
}